[[task]]
  id = "templ"
  type = "short"
  watch = ["**/*.templ"]
  cmd = "go tool templ generate"

[[task]]
  id = "tidy"
  type = "short"
  dependencies = ["templ"]
  cmd = "go mod tidy -e"

[[task]]
  id = "generate"
  type = "short"
  dependencies = ["tidy"]

[[task]]
  id = "test"
  type = "short"
  dependencies = ["generate"]
  cmd = "go test ./..."

